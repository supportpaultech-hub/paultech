<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="160" fill="url(#halo)" />

  <!-- Subtle grid lines for high-tech aesthetic -->
  <path d="M0 100 H400 M0 200 H400 M0 300 H400 M0 400 H400" stroke="#334155" stroke-opacity="0.2" stroke-width="1" />
  <path d="M100 0 V500 M200 0 V500 M300 0 V500" stroke="#334155" stroke-opacity="0.2" stroke-width="1" />

  <!-- Executive Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="175" r="58" fill="url(#silhouetteGrad)" />
  <!-- Neck -->
  <path d="M185 228 H215 V255 H185 Z" fill="url(#silhouetteGrad)" />
  <!-- Shoulders & Suit Torso -->
  <path d="M100 375 C100 295 140 260 178 255 L200 282 L222 255 C260 260 300 295 300 375 C300 420 100 420 100 375 Z" fill="url(#silhouetteGrad)" />
  <!-- Suit Collar / Tie subtle accents -->
  <path d="M178 255 L200 310 L222 255 L208 255 L200 275 L192 255 Z" fill="#0f172a" opacity="0.6" />
  <path d="M195 275 L205 275 L203 330 L200 338 L197 330 Z" fill="#38bdf8" opacity="0.75" />

  <!-- Initials badge overlay -->
  <g transform="translate(200, 420)">
    <rect x="-45" y="-18" width="90" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="0" y="2" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CO-FOUNDER</text>
  </g>
</svg>
